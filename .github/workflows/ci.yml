name: Windows validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Parse scripts with Windows PowerShell 5.1
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'This check must use Windows PowerShell 5.1.' }
          $scripts = @(Get-ChildItem scripts,tests -Filter '*.ps1' -Recurse)
          foreach ($script in $scripts) {
            $tokens = $null; $parseErrors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw "$($script.Name): $($parseErrors -join '; ')" }
          }
          Write-Output "Parsed $($scripts.Count) scripts with PowerShell $($PSVersionTable.PSVersion)."

      - name: Fetch pinned upstream source fixture
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = '21185da63a9e4307ae876b3702a43a43044d451c'
          $relative = 'CustomHeadsetOpenVR/DriverFiles/resources/shaders/d3d11/distort_ps_layered.hlsl'
          $baseline = Join-Path $PWD ('research/CustomHeadsetOpenVR/' + $relative)
          New-Item -ItemType Directory -Path (Split-Path -Parent $baseline) -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/sboys3/CustomHeadsetOpenVR/$commit/$relative" -OutFile $baseline
          $expected = '65CAAA283BE3F4FD9B8F62459E2E73D5D3B5136E6448A635C518217003E902CB'
          if ((Get-FileHash -LiteralPath $baseline -Algorithm SHA256).Hash -ne $expected) { throw 'Upstream fixture hash mismatch.' }

      - name: Test install, conflict handling, and rollback on isolated fixtures
        run: |
          New-Item -ItemType Directory -Path artifacts/ci -Force | Out-Null
          & ./scripts/Test-Psvr2UpscalingManagement.ps1 | Tee-Object -FilePath artifacts/ci/management.json

      - name: Build and verify the release package
        run: |
          $ErrorActionPreference = 'Stop'
          $package = & ./scripts/New-ReleasePackage.ps1 -Version '0.1.0-ci'
          $verification = & ./tests/Test-ReleasePackage.ps1 -PackagePath $package.zipPath
          $verification | ConvertTo-Json -Depth 5 | Set-Content artifacts/ci/package.json -Encoding UTF8
          $verification.extractedRoot | Set-Content artifacts/ci/package-root.txt -Encoding UTF8

      - name: Test the packaged manager on isolated fixtures
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = (Get-Content artifacts/ci/package-root.txt -Raw).Trim()
          & ./scripts/Test-Psvr2UpscalingManagement.ps1 -ManagerPath (Join-Path $packageRoot 'scripts/Manage-Psvr2Upscaling.ps1') | Tee-Object -FilePath artifacts/ci/packaged-management.json

      - name: Smoke-test the packaged GUI without SteamVR
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = (Get-Content artifacts/ci/package-root.txt -Raw).Trim()
          & (Join-Path $packageRoot 'scripts/Show-Psvr2Upscaling.ps1') -SmokeTest -SmokeTestResultPath (Join-Path $PWD 'artifacts/ci/gui.json')
          if (-not (Test-Path artifacts/ci/gui.json)) { throw 'GUI smoke test did not produce its result.' }
          $result = Get-Content artifacts/ci/gui.json -Raw | ConvertFrom-Json
          if ($result.result -ne 'PASS' -or $result.guiCreated -ne $true -or $result.hostOperations -ne 0 -or $result.visibleWindowShown -ne $false) {
            throw 'Packaged GUI smoke test failed or attempted to show a window/operate the host.'
          }
          $result | ConvertTo-Json

      - name: Keep offline validation results and package
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-validation
          path: |
            artifacts/ci/*.json
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error
          retention-days: 14
